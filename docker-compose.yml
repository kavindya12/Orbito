services:
  postgres:
    image: postgres:16-alpine
    container_name: orbito-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orbito
      POSTGRES_PASSWORD: orbito
      POSTGRES_DB: orbito
    volumes:
      - orbito_pg_data:/var/lib/postgresql/data

volumes:
  orbito_pg_data:
